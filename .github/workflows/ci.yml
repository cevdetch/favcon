name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Pinned, not ubuntu-latest, so an image flip never arrives inside an unrelated change.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so skip the credential helper.
          persist-credentials: false

      # One step installs the pnpm pinned in "packageManager" as a native binary, plus the
      # runtime, then runs the install. `require-lockfile` makes it --frozen-lockfile and
      # fails on a missing lockfile rather than resolving one from the registry.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Node 24 is both the engines floor and the current LTS, so one version covers both.
          runtime: node@24
          require-lockfile: true

      # icoutils is here for one reason: so the ICO-equivalence test runs instead of skipping.
      # It is not a dependency of the tool; favseed writes the 22-byte container itself.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y icoutils

      # A pinned release tarball, not `cargo install`, which takes minutes. The engine's
      # render test compares against this binary, the same resvg the engine bundles.
      - name: resvg (the reference the engine's render test compares against)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/resvg.tar.gz \
            "https://github.com/linebender/resvg/releases/download/v0.48.1/resvg-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/resvg.tar.gz -C /usr/local/bin resvg
          sudo chmod +x /usr/local/bin/resvg

      - run: pnpm test
      - run: node test/hashes.mjs > hashes-linux.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-linux
          path: hashes-linux.txt

  macos:
    # Apple Silicon: the engine's darwin-arm64 binary, the whole suite.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          require-lockfile: true
      - run: pnpm test
      - run: node test/hashes.mjs > hashes-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-macos
          path: hashes-macos.txt

  windows:
    # The whole suite: nothing needs installing.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          require-lockfile: true
      - run: pnpm test
      # bash, not PowerShell: the file must hold the bytes the script printed, LF endings
      # included, or the comparison below fails on line endings alone.
      - run: node test/hashes.mjs > hashes-windows.txt
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-windows
          path: hashes-windows.txt

  same-bytes:
    # The engine's claim: one SVG gives the same bytes on every platform.
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*
          merge-multiple: true
      - run: diff hashes-linux.txt hashes-macos.txt && diff hashes-linux.txt hashes-windows.txt

  site:
    # The website imports lib/core.mjs by path, so a change to the shared half can break it
    # without touching site/. Build it and run the real pipeline in a headless browser.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          require-lockfile: true
      - run: pnpm --filter favseed-site test
      - run: pnpm --filter favseed-site build
      # The runner image ships Google Chrome, not a `chromium` binary.
      - run: node site/test/cdp-check.mjs
        env:
          CHROME: google-chrome

  workflows:
    # Static analysis of the workflows themselves: template injection, over-broad
    # permissions, unpinned actions. zizmor's own version is pinned like every other tool.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false
